[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "1.0.0"
description = "Customer churn prediction on the IBM Telco Customer Churn dataset"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Deon Jones" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
